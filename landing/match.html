ckets."},{"id":"0015","es":"Tener la sartén por el mango","it":"Tenere il coltello dalla parte del manico","esM":"To be in control; to have the upper hand.","itM":"To be the one in control."},{"id":"0016","es":"A caballo regalado no le mires el diente","it":"A caval donato non si guarda in bocca","esM":"Don't find fault with a gift.","itM":"Don't find fault with something given freely."},{"id":"0017","es":"No pegar ojo","it":"Non chiudere occhio","esM":"To not sleep a wink.","itM":"To not sleep at all."},{"id":"0018","es":"Echar una mano","it":"Dare una mano","esM":"To lend a hand; to help out.","itM":"To help someone out."},{"id":"0019","es":"Poner las cartas sobre la mesa","it":"Mettere le carte in tavola","esM":"To be fully open about one's intentions.","itM":"To lay everything out openly."},{"id":"0020","es":"Dormir a pierna suelta","it":"Dormire come un ghiro","esM":"To sleep deeply and soundly.","itM":"To sleep very deeply."},{"id":"0021","es":"Estar entre la espada y la pared","it":"Essere tra l'incudine e il martello","esM":"To be stuck between two bad options.","itM":"To be trapped between two equally bad outcomes."},{"id":"0022","es":"Buscarle tres pies al gato","it":"Cercare il pelo nell'uovo","esM":"To overcomplicate things; to look for problems that aren't there.","itM":"To nitpick; to find fault over trivia."},{"id":"0023","es":"Ir al grano","it":"Andare al sodo","esM":"To get to the point.","itM":"To get to the heart of the matter."},{"id":"0024","es":"Estar como pez en el agua","it":"Essere un pesce fuor d'acqua","esM":"To feel completely at ease in a setting.","itM":"To be out of one's element; visibly out of place."},{"id":"0025","es":"Ser uña y mugre","it":"Essere come il cacio sui maccheroni","esM":"To be inseparable friends.","itM":"To be a perfect fit; two things that complete each other."},{"id":"0026","es":"Estar hasta las narices","it":"Averne fin sopra i capelli","esM":"To be fed up; to have had enough.","itM":"To be completely fed up."},{" ","it":"In bocca al lupo","esM":"Good luck — wished directly, no ritual attached.","itM":"Good luck — with a ritual reply: never grazie, always 'crepi (il lupo)'."},{"id":"0040","es":"No ver la hora","it":"Non vedere l'ora","esM":"To be unable to wait; to be dying for something.","itM":"To be unable to wait; to look forward eagerly."},{"id":"0041","es":"Cada muerte de obispo","it":"Ogni morte di papa","esM":"Once in a blue moon; very rarely.","itM":"Once in a blue moon; very rarely."},{"id":"0043","es":"Con las manos en la masa","it":"Con le mani nel sacco","esM":"Caught red-handed; in the act.","itM":"Caught red-handed; in the act."},{"id":"0044","es":"Como caído del cielo","it":"Cadere dalle nuvole","esM":"Heaven-sent; arriving exactly when needed (POSITIVE).","itM":"To be stunned by unexpected news; taken completely aback (SURPRISE)."},{"id":"0045","es":"Soltar la sopa","it":"Sputare il rospo","esM":"To spill the beans; to finally talk.","itM":"To come out with it; to finally say the difficult thing."},{"id":"0046","es":"Despacito","it":"Piano piano","esM":"Slowly, gently; easy does it — softened by the diminutive.","itM":"Slowly, gently; little by little; easy does it."},{"id":"0047","es":"Bien, pero no tan bien","it":"Bene ma non benissimo","esM":"Fine, but not great — the deflating follow-up.","itM":"Fine, but not great — ironic understatement; things are slightly off."},{"id":"0048","es":"Quien fue a Sevilla perdió su silla","it":"Chi va a Roma perde la poltrona","esM":"Leave your spot and you forfeit it — the playground law of vacated seats.","itM":"Leave your spot and you forfeit it."},{"id":"0049","es":"Morirse de hambre","it":"Morire di fame","esM":"To be starving (figurative); the reflexive marks the hyperbole.","itM":"To be starving (figurative) — or literally to starve; context decides."},{"id":"0050","es":"Tener dos dedos de frente","it":"Avere sale in zucca","esM":"To have common sense; to show basic good judgment. Usually heard in the negative.","itM":"To have good sense; to be sensible. Usually heard in the negative."},{"id":"0051","es":"Camarón que se duerme se lo lleva la corriente","it":"Chi dorme non piglia pesci","esM":"Snooze and you lose — inattention gets you swept away.","itM":"The sleeper catches nothing — idleness costs you."},{"id":"0052","es":"Más vale pájaro en mano que cien volando","it":"Meglio un uovo oggi che una gallina domani","esM":"Take the certain smaller thing over the uncertain larger one.","itM":"Take the certain smaller thing now over the larger promised later."},{"id":"0053","es":"Hoy por ti, mañana por mí","it":"Oggi a me, domani a te","esM":"I help you now, you help me later — reciprocity between equals.","itM":"What happens to me now will happen to you later — reciprocity, and often a warning."},{"id":"0054","es":"El que no arriesga, no gana","it":"Chi non risica non rosica","esM":"No risk, no reward.","itM":"No risk, no nibble — no reward without daring."},{"id":"0055","es":"Estar en el banquillo","it":"Essere in panchina","esM":"To be a substitute; to be benched.","itM":"To be a substitute; to be benched."},{"id":"0056","es":"Al que madruga, Dios le ayuda","it":"Il mattino ha l'oro in bocca","esM":"The early riser is rewarded.","itM":"The morning hours are the most valuable."},{"id":"0057","es":"A hierro candente, batir de repente","it":"Battere il ferro finché è caldo","esM":"Act while the moment is hot; deal with it now.","itM":"Act while conditions favour you."},{"id":"0058","es":"Entre marido y mujer, nadie se debe meter","it":"Tra moglie e marito non mettere il dito","esM":"Stay out of other people's marriages.","itM":"Do not interfere in a couple's business."},{"id":"0059","es":"Mucho ruido y pocas nueces","it":"Tutto fumo e niente arrosto","esM":"All talk and no substance.","itM":"All show and no substance."},{"id":"0060","es":"Hacer puente","it":"Fare il ponte","esM":"To take the day between a holiday and the weekend off.","itM":"To take the day between a holiday and the weekend off."},{"id":"0061","es":"A lo hecho, pecho","it":"Piangere sul latte versato","esM":"What's done is done — square your shoulders and face it.","itM":"To lament what can no longer be changed (usually in the negative: don't)."},{"id":"0062","es":"No hay mal que por bien no venga","it":"Non tutti i mali vengono per nuocere","esM":"Every misfortune brings something good with it.","itM":"Some misfortunes turn out to be for the best."},{"id":"0063","es":"No dejes para mañana lo que puedas hacer hoy","it":"Chi ha tempo non aspetti tempo","esM":"Don't postpone what you're able to do now.","itM":"If you have the chance now, don't wait for a better moment."},{"id":"0064","es":"Botar la llave","it":"Buttare via la chiave","esM":"To put someone away for good — usually in 'encerrarlo y botar la llave'.","itM":"To put someone away for good — usually in 'rinchiuderlo e buttare via la chiave'."},{"id":"0065","es":"Me late que","it":"Mi sa che","esM":"I have a feeling that; something tells me.","itM":"I have a feeling that; I suspect."},{"id":"0066","es":"¡Ándale!","it":"Dai","esM":"Come on!; that's it!; also 'exactly!' when agreeing.","itM":"Come on!; go on; also softening disbelief (ma dai = no way)."},{"id":"0067","es":"Imagínate","it":"Figurati","esM":"Just imagine; wow — an intensifier of surprise or empathy, NOT a reply to thanks.","itM":"Don't mention it; not at all; also 'of course not' — the standard wave-off of thanks."},{"id":"0068","es":"¡Madre mía!","it":"Mamma mia!","esM":"Good heavens; oh my — surprise, dismay, awe.","itM":"Good heavens; oh my — surprise, dismay, awe."},{"id":"0069","es":"¡Sepa!","it":"Boh","esM":"Who knows; beats me — the one-word shrug.","itM":"Dunno; who knows — the minimal Italian shrug, felt as untranslatable."},{"id":"0070","es":"¡Viva México!","it":"Viva l'Italia!","esM":"The cry of the Grito, on the night of 15 September.","itM":"Patriotic cry, heard on 2 June."},{"id":"0071","es":"Ser un manirroto","it":"Avere le mani bucate","esM":"To be a spendthrift; to burn through money.","itM":"To spend money easily; to be unable to save."},{"id":"0072","es":"Estar con el agua al cuello","it":"Avere l'acqua alla gola","esM":"To be in serious trouble, usually financial.","itM":"To be in serious difficulty, often from money or a deadline."},{"id":"0073","es":"No saber a qué carta quedarse","it":"Non sapere che pesce prendere","esM":"To be unable to decide; to not know which way to go.","itM":"To be confused; to not know what to do."},{"id":"0074","es":"Tener pájaros en la cabeza","it":"Avere grilli per la testa","esM":"To be full of unrealistic notions; to be flighty.","itM":"To have strange or unrealistic ideas; to be restless."},{"id":"0075","es":"Tener buen diente","it":"Essere una buona forchetta","esM":"To have a hearty appetite; to be a big eater.","itM":"To love eating; to have a big appetite."},{"id":"0076","es":"De buenas a primeras","it":"Su due piedi","esM":"Right off the bat; suddenly and without warning, with no time to prepare.","itM":"On the spot; immediately, without time to think it over."},{"id":"0077","es":"Te quiero","it":"Ti voglio bene","esM":"I love you — the warm everyday form, used with partners, family and close friends alike.","itM":"I love you — affection for family and friends, and explicitly NOT the romantic declaration."},{"id":"0078","es":"Ser cuatro gatos","it":"Essere quattro gatti","esM":"To be hardly anyone; a very thin crowd.","itM":"There to be hardly anyone; a very thin crowd."},{"id":"0079","es":"Estar como boca de lobo","it":"Essere buio pesto","esM":"To be pitch dark; utterly without light.","itM":"To be pitch dark."},{"id":"0080","es":"Tengo calor","it":"Ho caldo","esM":"I'm hot (temperature).","itM":"I'm hot (temperature)."},{"id":"0081","es":"Arrimar el ascua a su sardina","it":"Tirare l'acqua al proprio mulino","esM":"To turn every situation to one's own advantage.","itM":"To turn every situation to one's own advantage."},{"id":"0083","es":"Cuando las ranas c const N = 5;

const $ = (s) => document.querySelector(s);
const shuffle = (a) => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function sample() {
  // no two tiles in a round may share display text — ambiguity isn't a puzzle, it's a bug
  const out = [], seen = new Set();
  for (const e of shuffle(DATA)) {
    const texts = mode === "pair" ? [e.es, e.it] : mode === "es" ? [e.es, e.esM] : [e.it, e.itM];

    texts.forEach((t) => seen.add(t));
    out.push(e);
    if (out.length === N) break;
  }
  return out;
}

function tile(id, html, side, col) {
  const b = document.createElement("button");
  b.className = "tile"; b.dataset.id = id; b.dataset.col = col;
  if (side) b.dataset.side = side;
  b.setAttribute("aria-pressed", "false");
  b.innerHTML = html;
  b.addEventListener("click", () => pick(b));
  return b;
}

  for (const e of left) {
    if (mode === "pair") L.appendChild(tile(e.id, '<span class="exp" lang="es">'+e.es+'</span>', "es", "l"));
    else if (mode === "es") L.appendChild(tile(e.id, '<span class="exp" lang="es">'+e.es+'</span>', "es", "l"));
    else L.appendChild(tile(e.id, '<span class="exp" lang="it">'+e.it+'</span>', "it", "l"));
  }
  for (const e of right) {
    if (mode === "pair") R.appendChild(tile(e.id, '<span class="exp" lang="it">'+e.it+'</span>', "it", "r"));
    else R.appendChild(tile(e.id, '<span lang="en">'+(mode === "es" ? e.esM : e.itM)+'</span>', null, "r"));
  }
  say(matched + " of " + N + " matched");
}

function say(t) { $("#status").textContent = t; }

function pick(b) {
  if (b.classList.contains("ok")) return;
  const k = b.dataset.col;
  if (sel[k]) sel[k].setAttribute("aria-pressed", "false");
  sel[k] = b; b.setAttribute("aria-pressed", "true");
  if (sel.l && sel.r) {
    if (sel.l.dataset.id === sel.r.dataset.id) {
      [sel.l, sel.r].forEach((t) => { t.classList.add("ok"); t.setAttribute("aria-pressed","false"); t.disabled = true; });
      matched++;
      say(matched === N ? "All " + N + " matched — nicely done. New round?" : matched + " of " + N + " matched");
    } else {
      [sel.l, sel.r].forEach((t) => { t.classList.add("bad"); t.setAttribute("aria-pressed","false"); });
      setTimeout(() => [sel.l, sel.r].forEach((t) => t && t.classList.remove("bad")), 400);
      say("Not partners — try again");
    }
    sel = { l: null, r: null };
  }
}

document.querySelectorAll(".modes button").forEach((b) =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".modes button").forEach((x) => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    mode = b.dataset.mode;
    render();
  })
);
$("#again").addEventListener("click", render);
render();
</script>
</body>
</html>
